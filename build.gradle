plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

base { archivesName = 'foremon' }

repositories {
	mavenCentral()
	maven { url = 'https://maven.impactdev.net/repository/development/' }
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://api.modrinth.com/maven' }
}

sourceSets {
	// In-game tests: a real headless server with real Cobblemon Pokemon. Not part of the released jar.
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	// Client-only code lives in src/client so it can never be loaded on a dedicated server.
	splitEnvironmentSourceSets()
}

// src/main and src/client are shared with the NeoForge build (neoforge/); the Fabric-only glue lives beside them.
sourceSets {
	main.kotlin.srcDir 'src/fabric/kotlin'
	client.kotlin.srcDir 'src/fabricClient/kotlin'
}

loom {
	mods {
		"foremon" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"foremon_gametest" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		gametest {
			server()
			name "Game Test"
			source sourceSets.gametest
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/gametest-junit.xml"
			runDir "build/gametest"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	// -Pcobblemon_runtime_version=1.8.4+1.21.1 builds against cobblemon_version (like the released jar) but runs the
	// game and gametests on another Cobblemon, to catch calls that compile but break at runtime.
	def runCobblemon = findProperty("cobblemon_runtime_version")
	if (runCobblemon) {
		modCompileOnly "com.cobblemon:fabric:${project.cobblemon_version}"
		modRuntimeOnly "com.cobblemon:fabric:${runCobblemon}"
	} else {
		modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
	}
	// Cobblemon 1.8's battle engine needs icu4j 71.1; dev runs would pick Minecraft's 73.2 and hang at startup.
	if (!(runCobblemon ?: project.cobblemon_version).startsWith("1.7")) {
		configurations.matching { it.name.endsWith("untimeClasspath") }.configureEach { resolutionStrategy.force "com.ibm.icu:icu4j:71.1" }
	}

	// Only in the development game, to test building from Litematica. Not a dependency of the mod.
	modLocalRuntime "maven.modrinth:litematica:0.19.58"
	modLocalRuntime "maven.modrinth:malilib:0.21.8"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
	// Strip indentation from JSON so the jar stays small.
	filesMatching(['**/*.json', '**/*.mcmeta']) {
		filter { String line -> line.trim() }
	}
}

test { useJUnitPlatform() }

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
kotlin { jvmToolchain(21) }
java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// A self-driving client used only in development: it plays through the mod and saves screenshots.
// Declared down here because the client source set only exists after the loom block above.
sourceSets {
	probe {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output + sourceSets.client.compileClasspath + sourceSets.client.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output + sourceSets.client.runtimeClasspath + sourceSets.client.output
	}
}

loom {
	mods {
		"foremon_probe" {
			sourceSet sourceSets.probe
		}
	}
	runs {
		probe {
			client()
			name "Probe"
			source sourceSets.probe
			vmArg "-Dforemon.probe=true"
			vmArg "-Dforemon.debug=true"
			runDir "run"
		}
	}
}

// Every game test run starts from a fresh world: Pokemon that earlier runs left in the test PC would fill it up.
tasks.matching { it.name == "runGametest" }.configureEach { doFirst { delete layout.buildDirectory.dir("gametest/world") } }
